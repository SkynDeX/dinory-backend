#########################################
# Dinory 백엔드 CI/CD 워크플로우
#
# 이 파일은 백엔드 코드가 변경될 때 자동으로:
# 1. Spring Boot 프로젝트를 빌드하고
# 2. Docker 이미지를 생성하고
# 3. Docker Hub에 업로드하고
# 4. 서버에 배포합니다
#########################################

name: Backend CI/CD

# 🎯 언제 실행할까요?
on:
  push:
    branches:
      - main              # main 브랜치에 push할 때
      - develop           # develop 브랜치에 push할 때

  workflow_dispatch:      # 수동 실행 가능

# 🔧 작업 정의
jobs:
  build-and-deploy:
    name: 빌드 및 배포
    runs-on: ubuntu-latest

    steps:
      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      # Step 1: 코드 가져오기
      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      - name: 📥 코드 체크아웃
        uses: actions/checkout@v4

      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      # Step 2: JDK 21 설정
      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      - name: ☕ JDK 21 설정
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'  # Eclipse Temurin (과거 AdoptOpenJDK)
          java-version: '21'
          cache: 'gradle'          # Gradle 캐시 사용 (빌드 속도 향상)

      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      # Step 3: Gradle 권한 설정
      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      - name: 🔧 Gradle 실행 권한 부여
        run: chmod +x gradlew

      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      # Step 4: 테스트 (선택사항)
      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      # 테스트를 실행하려면 아래 주석을 해제하세요
      # - name: 🧪 테스트 실행
      #   run: ./gradlew test

      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      # Step 5: Docker 설정
      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      - name: 🐳 Docker Buildx 설정
        uses: docker/setup-buildx-action@v3

      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      # Step 6: Docker Hub 로그인
      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      - name: 🔐 Docker Hub 로그인
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      # Step 7: Docker 이미지 빌드 & 푸시
      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      - name: 🏗️ Docker 이미지 빌드 및 푸시
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/dinory-backend:latest
            ${{ secrets.DOCKER_USERNAME }}/dinory-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      # Step 8: 서버에 배포
      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      - name: 🚀 서버 배포
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            # 배포 디렉토리로 이동
            cd /home/${{ secrets.SERVER_USERNAME }}/dinory

            # 최신 이미지 가져오기
            docker pull ${{ secrets.DOCKER_USERNAME }}/dinory-backend:latest

            # 기존 컨테이너 중지 및 제거
            docker-compose -f docker-compose.instance1.yml stop backend 2>/dev/null || true
            docker-compose -f docker-compose.instance1.yml rm -f backend 2>/dev/null || true

            # 새 컨테이너 시작
            docker-compose -f docker-compose.instance1.yml up -d backend

            # 컨테이너 상태 확인 (30초 대기 후)
            sleep 30
            docker-compose -f docker-compose.instance1.yml ps backend

            # 로그 확인 (최근 30줄)
            docker-compose -f docker-compose.instance1.yml logs --tail 30 backend

            # 사용하지 않는 이미지 정리
            docker image prune -f

      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      # Step 9: 배포 완료 알림
      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      - name: ✅ 배포 완료
        run: |
          echo "🎉 백엔드 배포가 완료되었습니다!"
          echo "📦 이미지: ${{ secrets.DOCKER_USERNAME }}/dinory-backend:latest"
          echo "🔗 커밋: ${{ github.sha }}"